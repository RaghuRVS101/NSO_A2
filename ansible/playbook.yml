---
- name: Common setup on all hosts
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Wait for cloud-init to finish
      command: cloud-init status --wait
      changed_when: false

    - name: Wait for unattended-upgrades to release the apt lock
      shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
           || fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
          sleep 2
        done
      changed_when: false

    - name: Install base packages
      apt:
        name: [python3, python3-pip, python3-flask]
        state: present
        update_cache: true
        lock_timeout: 300

    - name: Create /opt/nso working directory
      file:
        path: /opt/nso
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

- name: Service nodes
  hosts: nodes
  become: true
  tasks:
    - name: Install snmpd
      apt: { name: snmpd, state: present, lock_timeout: 300 }

    - name: Copy service.py
      copy:
        src: ../service.py
        dest: /opt/nso/service.py
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Install systemd unit for service.py
      template:
        src: service.service.j2
        dest: /etc/systemd/system/nso-service.service
        mode: '0644'
      notify: restart nso-service

    - name: Configure snmpd
      template:
        src: snmpd.conf.j2
        dest: /etc/snmp/snmpd.conf
        mode: '0644'
      notify: restart snmpd

    - name: Enable snmpd
      systemd: { name: snmpd, enabled: true, state: started, daemon_reload: true }

    - name: Enable nso-service
      systemd: { name: nso-service, enabled: true, state: started, daemon_reload: true }

  handlers:
    - name: restart snmpd
      systemd: { name: snmpd, state: restarted }
    - name: restart nso-service
      systemd: { name: nso-service, state: restarted, daemon_reload: true }

- name: Proxy (HAProxy + UDP/SNMP NAT)
  hosts: proxy
  become: true
  tasks:
    - name: Install HAProxy
      apt: { name: haproxy, state: present, lock_timeout: 300 }

    - name: Render HAProxy config
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
      notify: restart haproxy

    - name: Enable HAProxy
      systemd: { name: haproxy, enabled: true, state: started }

    # HAProxy can't speak UDP, so kernel-level NAT redirects proxy:6000/udp
    # to the first node's snmpd on :161/udp.
    - name: Enable IPv4 forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_set: true

    - name: Clear stale SNMP DNAT rules
      iptables:
        table: nat
        chain: PREROUTING
        protocol: udp
        destination_port: '6000'
        jump: DNAT
        state: absent
      ignore_errors: true

    - name: DNAT UDP/6000 to first node :161
      iptables:
        table: nat
        chain: PREROUTING
        protocol: udp
        destination_port: '6000'
        jump: DNAT
        to_destination: "{{ hostvars[groups['nodes'][0]]['ansible_host'] }}:161"

    - name: MASQUERADE return traffic
      iptables:
        table: nat
        chain: POSTROUTING
        protocol: udp
        destination_port: '161'
        jump: MASQUERADE

  handlers:
    - name: restart haproxy
      systemd: { name: haproxy, state: restarted }

- name: Bastion (alive.py + nodes.yaml)
  hosts: bastion
  become: true
  tasks:
    - name: Install ping3
      pip: { name: ping3, executable: pip3 }

    - name: Copy alive.py
      copy:
        src: ../alive.py
        dest: /opt/nso/alive.py
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Generate nodes.yaml
      copy:
        dest: /opt/nso/nodes.yaml
        content: |
          {% for h in groups['nodes'] %}
          {{ hostvars[h]['ansible_host'] }}
          {% endfor %}
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      notify: restart alive

    - name: Install systemd unit for alive.py
      template:
        src: alive.service.j2
        dest: /etc/systemd/system/nso-alive.service
        mode: '0644'
      notify: restart alive

    - name: Enable nso-alive
      systemd: { name: nso-alive, enabled: true, state: started, daemon_reload: true }

  handlers:
    - name: restart alive
      systemd: { name: nso-alive, state: restarted, daemon_reload: true }
